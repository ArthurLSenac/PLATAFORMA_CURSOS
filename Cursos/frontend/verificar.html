<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="assets/js/tema.js"></script>
    <title>Verificar certificado — Lumina Academy</title>
    <script type="module" src="assets/js/paginas/verificar.js"></script>
</head>
<body>
    <header id="topo" class="topo"></header>
    <main class="verificar">
        <div class="cartao verificar__cartao">
            <div class="vazio__icone" id="icone-topo"></div>
            <h1 class="pequeno-titulo">Verificar certificado</h1>
            <p>Digite o código impresso no certificado para confirmar sua autenticidade.</p>
            <form id="form-verificar" class="linha espaco-topo">
                <label class="sr-only" for="codigo">Código do certificado</label>
                <input class="entrada" id="codigo" placeholder="XXXX-XXXX-XXXX" maxlength="20" autocomplete="off" spellcheck="false">
                <button class="btn btn--primario" type="submit" id="btn-verificar">Verificar</button>
            </form>
            <div class="verificar__resultado" id="resultado" aria-live="polite"></div>
        </div>
    </main>
    <footer id="rodape"></footer>
</body>
</html>
