<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="assets/js/tema.js"></script>
    <title>Criar conta — Lumina Academy</title>
    <script type="module" src="assets/js/paginas/cadastro.js"></script>
</head>
<body>
    <div class="auth">
        <aside class="auth__arte" id="arte"></aside>
        <main class="auth__formulario">
            <div class="auth__topo" id="auth-topo"></div>
            <div class="auth__cartao" id="cartao-cadastro">
                <h1>Crie sua conta</h1>
                <p>Preencha seus dados. Seu acesso será liberado após a aprovação do administrador.</p>
                <div id="mensagem" aria-live="assertive"></div>
                <form id="form-cadastro" novalidate>
                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input class="entrada" type="text" id="nome" autocomplete="name" placeholder="Como você quer ser chamado" maxlength="120" required>
                    </div>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input class="entrada" type="email" id="email" autocomplete="email" placeholder="voce@exemplo.com" maxlength="190" required>
                    </div>
                    <div class="campo">
                        <label for="senha">Senha</label>
                        <div class="entrada-icone entrada-icone--direita">
                            <input class="entrada" type="password" id="senha" autocomplete="new-password" placeholder="Mínimo 8 caracteres, com letras e números" maxlength="72" required>
                            <button type="button" class="btn btn--fantasma btn--icone btn--sm acao-entrada" id="mostrar-senha" aria-label="Mostrar senha"></button>
                        </div>
                        <div class="forca-senha" id="forca-senha" data-nivel="0" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
                        <small id="dica-senha">Use 8+ caracteres misturando letras, números e símbolos.</small>
                    </div>
                    <div class="campo">
                        <label for="confirmar">Confirmar senha</label>
                        <input class="entrada" type="password" id="confirmar" autocomplete="new-password" placeholder="Repita a senha" maxlength="72" required>
                    </div>
                    <button class="btn btn--primario btn--lg btn--bloco" type="submit" id="btn-cadastrar">Criar minha conta</button>
                </form>
                <p class="auth__rodape">Já tem uma conta? <a href="login.html">Entrar</a></p>
            </div>
        </main>
    </div>
</body>
</html>
